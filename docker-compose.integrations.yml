# Local stand-ins for the systems a school runs, to try the integrations end to end:
#
#   docker compose -f docker-compose.integrations.yml up -d
#   then set the CAMPUS_* variables listed in docs/integrations.md and start the agent.
#
#   Mailpit   http://localhost:8025   every e-mail the agent sends
#   Radicale  http://localhost:5232   CalDAV calendar (user campus / campus)
#   Keycloak  http://localhost:8080   OpenID Connect sign-in (admin / admin; realm "campus")
#   Phoenix   http://localhost:6006   traces received over OTLP
services:
  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]

  radicale:
    image: tomsquest/docker-radicale:latest
    ports: ["5232:5232"]
    volumes:
      - ./deploy/radicale/config:/config/config:ro
      - ./deploy/radicale/users:/config/users:ro

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports: ["8080:8080"]
    volumes:
      - ./deploy/keycloak/campus-realm.json:/opt/keycloak/data/import/campus-realm.json:ro

  phoenix:
    image: arizephoenix/phoenix:latest
    ports: ["6006:6006"]
