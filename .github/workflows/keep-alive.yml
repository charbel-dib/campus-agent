name: Keep the demo awake

# A free Hugging Face Space sleeps after 48 hours without visits and takes a minute or two to wake.
# One request a day keeps the public demo ready for whoever opens the link.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call the demo's health endpoint
        run: |
          for i in 1 2 3 4 5 6; do
            curl -fsS --max-time 30 https://charbeld77-agent-campus.hf.space/api/health && exit 0
            sleep 30   # the Space may be waking up
          done
          exit 1
