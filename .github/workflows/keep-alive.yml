name: Keep the demo awake

# A free Render service spins down after 15 minutes without traffic and takes about a minute to wake.
# A request every ten minutes keeps the public demo ready for whoever opens the link
# (one always-on free service fits in Render's 750 free hours a month).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call the demo's health endpoint
        run: |
          for i in 1 2 3 4 5 6; do
            curl -fsS --max-time 30 https://agent-campus.onrender.com/api/health && exit 0
            sleep 20   # the service may be waking up
          done
          exit 1
