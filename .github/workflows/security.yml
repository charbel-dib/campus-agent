name: Security

# Dependency audit, static analysis, image scan and a software bill of materials (CycloneDX).
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"      # every Monday: new advisories appear without any change here

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The pip and setuptools bundled with the runner's Python have published advisories; upgrade them first.
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: pip install -e ".[sso]" pip-audit "bandit[toml]" cyclonedx-bom
      - name: Known vulnerabilities in dependencies
        run: pip-audit --skip-editable --desc
      - name: Static analysis (medium severity and above)
        run: bandit -c pyproject.toml -r campus_agent -ll -q
      - name: Software bill of materials
        run: cyclonedx-py environment --output-format JSON -o sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t campus-agent .
      # Scan the container's final filesystem, flattened: what runs is what is checked. The layer scan kept
      # reporting pip 24.0 and setuptools 70.3.0 after the build had replaced or deleted them. Trivy runs from
      # its image at a pinned version rather than from a moving action reference.
      - name: Flatten the image
        run: |
          docker create --name scan campus-agent
          docker export scan -o rootfs.tar
          mkdir rootfs && sudo tar -xf rootfs.tar -C rootfs
      - name: Scan the image (fails on critical or high vulnerabilities that have a fix)
        run: |
          docker run --rm -v "$PWD/rootfs:/rootfs:ro" -v "$PWD/.trivyignore:/trivyignore:ro" aquasec/trivy:0.58.1 \
            rootfs --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed --ignorefile /trivyignore \
            --exit-code 1 --no-progress /rootfs
      - name: Where the findings are (on failure)
        if: failure()
        run: |
          docker run --rm -v "$PWD/rootfs:/rootfs:ro" aquasec/trivy:0.58.1 rootfs -q --scanners vuln \
            --severity CRITICAL,HIGH --ignore-unfixed --format json /rootfs \
            | jq -r '.Results[] | .Target as $t | (.Vulnerabilities // [])[] | "\($t)  \(.PkgName) \(.InstalledVersion)  \(.PkgPath // "-")  \(.VulnerabilityID)"'
