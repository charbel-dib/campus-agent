name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: python -m pytest -q

  docker:
    # Builds the campus agent image and checks that it starts and serves its page and API.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t campus-agent .
      - run: docker run -d --name campus -p 8000:8000 -e CAMPUS_SECRET_KEY=ci campus-agent
      - name: Wait for the service
        run: |
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/api/health && exit 0; sleep 1; done
          docker logs campus; exit 1
      - run: curl -fsS http://127.0.0.1:8000/ | grep -q "Ker Avel"
      - run: |
          token=$(curl -fsS -X POST http://127.0.0.1:8000/api/login -H 'content-type: application/json' \
                    -d '{"person_id":"stu-0001"}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')
          curl -fsS http://127.0.0.1:8000/api/calendar -H "authorization: Bearer $token" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["view"] == "full" and d["events"], d'
